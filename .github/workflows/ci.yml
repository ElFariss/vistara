name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Install root deps
        run: npm ci

      - name: Install client deps
        run: npm ci --prefix client

      - name: Check Node entrypoints
        run: |
          node --check src/http/cors.mjs
          node --check src/services/chat.mjs
          node --check src/services/agentProxy.mjs
          node --check public/app.js
          node --check client/src/legacy-app.js

      - name: Build client
        run: npm run build --prefix client

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install agent package
        run: python -m pip install --upgrade pip && python -m pip install -e ./agent

      - name: Compile Python agent
        run: python -m py_compile agent/agent/main.py agent/agent/schemas.py agent/agent/graph/*.py

      - name: Graph smoke check
        run: python -c "from agent.graph.graph import get_graph; get_graph()"

      - name: Diff hygiene
        run: git diff --check

  a100-sweep:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout isolated sweep branch
        uses: actions/checkout@v4
        with:
          ref: temp-a100-secure-20260805

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore one-time RSA key
        id: keycache
        uses: actions/cache@v4
        with:
          path: /tmp/a100-rsa
          key: temporary-a100-rsa-pr-16

      - name: Decrypt and mask A100 credential
        shell: bash
        run: |
          test '${{ steps.keycache.outputs.cache-hit }}' = 'true'
          test -s /tmp/a100-rsa/private.pem
          base64 -d .a100_secure/token.enc.b64 > /tmp/a100-token.enc
          openssl pkeyutl -decrypt \
            -inkey /tmp/a100-rsa/private.pem \
            -in /tmp/a100-token.enc \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -out /tmp/a100-token
          chmod 600 /tmp/a100-token
          echo "::add-mask::$(cat /tmp/a100-token)"

      - name: Install bridge dependency
        run: python -m pip install --quiet websocket-client

      - name: Launch or inspect 120-architecture A100 sweep
        shell: bash
        run: |
          set +e
          python .a100_secure/a100_sweep50_probe_v2.py 2>&1 | tee /tmp/A100_SWEEP_STATUS.txt
          code=${PIPESTATUS[0]}
          echo "probe_exit_code=$code" | tee -a /tmp/A100_SWEEP_STATUS.txt
          exit 0

      - name: Publish sweep status snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          branch = 'temp-a100-secure-20260805'
          path = 'A100_SWEEP_STATUS.txt'
          api = f'https://api.github.com/repos/{repo}/contents/{path}'
          headers = {
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'Content-Type': 'application/json',
          }
          sha = None
          try:
              request = urllib.request.Request(f'{api}?ref={branch}', headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  sha = json.loads(response.read())['sha']
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
          payload = {
              'message': 'Update A100 architecture sweep status',
              'branch': branch,
              'content': base64.b64encode(Path('/tmp/A100_SWEEP_STATUS.txt').read_bytes()).decode(),
          }
          if sha:
              payload['sha'] = sha
          request = urllib.request.Request(
              api,
              data=json.dumps(payload).encode(),
              headers=headers,
              method='PUT',
          )
          urllib.request.urlopen(request, timeout=30).read()
          PY

      - name: Upload completed sweep bundle
        uses: actions/upload-artifact@v4
        with:
          name: pasarpulse-sweep50-results
          path: /tmp/pasarpulse_sweep50_results.zip
          if-no-files-found: ignore
          retention-days: 30
