name: Temporary A100 Path Bootstrap

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]
    paths:
      - 'TEMP_A100_SECURE_RUN.txt'
      - '.a100_secure/token.enc.b64'

permissions:
  contents: read

jobs:
  path-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore one-time RSA key
        id: keycache
        uses: actions/cache@v4
        with:
          path: /tmp/a100-rsa
          key: temporary-a100-rsa-pr-${{ github.event.pull_request.number }}
      - name: Decrypt and mask credential
        shell: bash
        run: |
          test '${{ steps.keycache.outputs.cache-hit }}' = 'true'
          base64 -d .a100_secure/token.enc.b64 > /tmp/a100-token.enc
          openssl pkeyutl -decrypt \
            -inkey /tmp/a100-rsa/private.pem \
            -in /tmp/a100-token.enc \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -out /tmp/a100-token
          chmod 600 /tmp/a100-token
          echo "::add-mask::$(cat /tmp/a100-token)"
      - name: Install websocket client
        run: python -m pip install --quiet websocket-client
      - name: Create Jupyter Contents compatibility symlink
        shell: bash
        run: |
          cat > /tmp/bootstrap.py <<'PY'
          import datetime as dt
          import json
          import ssl
          import urllib.request
          import uuid
          from pathlib import Path
          from urllib.parse import urljoin, urlparse

          import websocket

          base = 'https://node680-ai-hub.ub.ac.id/user/nafisnaufal1426/'
          token = Path('/tmp/a100-token').read_text().strip()

          def request(method, endpoint, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(
                  urljoin(base, endpoint), data=data, method=method,
                  headers={'Authorization': f'token {token}', 'Content-Type': 'application/json'},
              )
              with urllib.request.urlopen(req, timeout=90) as response:
                  raw = response.read()
              return json.loads(raw) if raw else None

          kernel = request('POST', 'api/kernels', {'name': 'python3'})
          kid = kernel['id']
          parsed = urlparse(base)
          session = uuid.uuid4().hex
          ws = websocket.create_connection(
              f'wss://{parsed.netloc}{parsed.path}api/kernels/{kid}/channels?session_id={session}',
              header=[f'Authorization: token {token}'],
              origin=f'{parsed.scheme}://{parsed.netloc}',
              sslopt={'cert_reqs': ssl.CERT_REQUIRED}, timeout=90,
          )
          msg_id = uuid.uuid4().hex
          command = "mkdir -p /home/nafisnaufal1426/home/nafisnaufal1426/adit/datathon-semi && ln -sfn /home/nafisnaufal1426/adit/datathon-semi/pasarpulse_data_pipeline_v6 /home/nafisnaufal1426/home/nafisnaufal1426/adit/datathon-semi/pasarpulse_data_pipeline_v6 && ls -ld /home/nafisnaufal1426/home/nafisnaufal1426/adit/datathon-semi/pasarpulse_data_pipeline_v6"
          code = (
              'import subprocess\n'
              f'_p=subprocess.run({command!r},shell=True,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)\n'
              "print(_p.stdout,end='')\n"
              "print(f'[exit={_p.returncode}]')\n"
          )
          message = {
              'header': {'msg_id': msg_id, 'username': 'bootstrap', 'session': session,
                         'date': dt.datetime.now(dt.timezone.utc).isoformat(),
                         'msg_type': 'execute_request', 'version': '5.3'},
              'parent_header': {}, 'metadata': {},
              'content': {'code': code, 'silent': False, 'store_history': False,
                          'user_expressions': {'exit_code': '_p.returncode'},
                          'allow_stdin': False, 'stop_on_error': True},
              'channel': 'shell', 'buffers': [],
          }
          exit_code = None
          idle = False
          try:
              ws.send(json.dumps(message))
              while True:
                  reply = json.loads(ws.recv())
                  if reply.get('parent_header', {}).get('msg_id') != msg_id:
                      continue
                  kind = reply.get('msg_type') or reply.get('header', {}).get('msg_type')
                  content = reply.get('content', {})
                  if kind == 'stream':
                      print(content.get('text', ''), end='')
                  elif kind == 'execute_reply':
                      value = content.get('user_expressions', {}).get('exit_code', {}).get('data', {}).get('text/plain')
                      exit_code = int(value) if value is not None else 1
                  elif kind == 'status' and content.get('execution_state') == 'idle':
                      idle = True
                  if idle and exit_code is not None:
                      if exit_code != 0:
                          raise SystemExit(exit_code)
                      break
          finally:
              ws.close()
              request('DELETE', f'api/kernels/{kid}')
          PY
          python /tmp/bootstrap.py
