name: Temporary A100 Progress Probe

on:
  push:
    branches:
      - temp-a100-secure-20260805
    paths:
      - '.github/workflows/temp-pasarpulse-compute.yml'
      - 'TEMP_A100_SECURE_RUN.txt'
      - '.a100_secure/**'

permissions:
  contents: write

jobs:
  progress-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore one-time RSA key
        id: keycache
        uses: actions/cache@v4
        with:
          path: /tmp/a100-rsa
          key: temporary-a100-rsa-pr-16

      - name: Decrypt and mask A100 credential
        shell: bash
        run: |
          test '${{ steps.keycache.outputs.cache-hit }}' = 'true'
          test -s /tmp/a100-rsa/private.pem
          base64 -d .a100_secure/token.enc.b64 > /tmp/a100-token.enc
          openssl pkeyutl -decrypt \
            -inkey /tmp/a100-rsa/private.pem \
            -in /tmp/a100-token.enc \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -out /tmp/a100-token
          chmod 600 /tmp/a100-token
          echo "::add-mask::$(cat /tmp/a100-token)"

      - name: Install bridge dependency
        run: python -m pip install --quiet websocket-client

      - name: Check live A100 optimizer progress
        run: python .a100_secure/a100_progress.py | tee /tmp/a100_progress.txt

      - name: Publish progress snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          branch = os.environ['GITHUB_REF_NAME']
          path = 'A100_PROGRESS.txt'
          api = f'https://api.github.com/repos/{repo}/contents/{path}'
          headers = {
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'Content-Type': 'application/json',
          }
          sha = None
          try:
              request = urllib.request.Request(f'{api}?ref={branch}', headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  sha = json.loads(response.read())['sha']
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
          payload = {
              'message': 'Update live A100 optimizer progress',
              'branch': branch,
              'content': base64.b64encode(Path('/tmp/a100_progress.txt').read_bytes()).decode(),
          }
          if sha:
              payload['sha'] = sha
          request = urllib.request.Request(
              api,
              data=json.dumps(payload).encode(),
              headers=headers,
              method='PUT',
          )
          urllib.request.urlopen(request, timeout=30).read()
          PY
