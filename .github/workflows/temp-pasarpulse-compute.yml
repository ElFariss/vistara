name: Temporary Secure A100 PasarPulse Run

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - 'TEMP_A100_SECURE_RUN.txt'
      - '.a100_secure/**'

permissions:
  contents: read

jobs:
  secure-a100:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Detect encrypted credential
        id: mode
        shell: bash
        run: |
          if test -s .a100_secure/token.enc.b64; then
            echo 'encrypted=true' >> "$GITHUB_OUTPUT"
          else
            echo 'encrypted=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Restore or reserve one-time RSA key
        id: keycache
        uses: actions/cache@v4
        with:
          path: /tmp/a100-rsa
          key: temporary-a100-rsa-pr-${{ github.event.pull_request.number }}

      - name: Generate one-time keypair
        if: steps.mode.outputs.encrypted == 'false'
        shell: bash
        run: |
          mkdir -p /tmp/a100-rsa
          test ! -e /tmp/a100-rsa/private.pem || exit 0
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/a100-rsa/private.pem
          chmod 600 /tmp/a100-rsa/private.pem
          openssl pkey -in /tmp/a100-rsa/private.pem -pubout -out /tmp/a100-rsa/public.pem

      - name: Upload public encryption key
        if: steps.mode.outputs.encrypted == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: a100-bridge-public-key
          path: /tmp/a100-rsa/public.pem
          if-no-files-found: error
          retention-days: 1

      - name: Stop after secure bootstrap
        if: steps.mode.outputs.encrypted == 'false'
        run: echo 'Secure A100 bridge key generated; waiting for encrypted credential.'

      - name: Validate restored private key
        if: steps.mode.outputs.encrypted == 'true'
        shell: bash
        run: |
          test '${{ steps.keycache.outputs.cache-hit }}' = 'true'
          test -s /tmp/a100-rsa/private.pem

      - name: Decrypt and mask A100 credential
        if: steps.mode.outputs.encrypted == 'true'
        shell: bash
        run: |
          base64 -d .a100_secure/token.enc.b64 > /tmp/a100-token.enc
          openssl pkeyutl -decrypt \
            -inkey /tmp/a100-rsa/private.pem \
            -in /tmp/a100-token.enc \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -out /tmp/a100-token
          chmod 600 /tmp/a100-token
          echo "::add-mask::$(cat /tmp/a100-token)"

      - name: Install bridge dependency
        if: steps.mode.outputs.encrypted == 'true'
        run: python -m pip install --quiet websocket-client

      - name: Execute optimizer on A100
        if: steps.mode.outputs.encrypted == 'true'
        shell: bash
        run: |
          cat > /tmp/a100_bridge.py <<'PY'
          from __future__ import annotations

          import base64
          import datetime as dt
          import json
          import ssl
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          import uuid
          from pathlib import Path
          from urllib.parse import urljoin, urlparse

          import websocket

          BASE_URL = "https://node680-ai-hub.ub.ac.id/user/nafisnaufal1426/"
          REMOTE_ROOT = "/home/nafisnaufal1426/adit/datathon-semi/pasarpulse_data_pipeline_v6"
          token = Path('/tmp/a100-token').read_text().strip()

          class JupyterClient:
              RETRIES = 6

              def __init__(self, base_url: str, token: str) -> None:
                  self.base_url = base_url.rstrip('/') + '/'
                  self.token = token

              def request(self, method: str, endpoint: str, payload: dict | None = None):
                  url = urljoin(self.base_url, endpoint)
                  data = None if payload is None else json.dumps(payload).encode()
                  req = urllib.request.Request(
                      url,
                      data=data,
                      method=method,
                      headers={
                          'Authorization': f'token {self.token}',
                          'Content-Type': 'application/json',
                      },
                  )
                  for attempt in range(self.RETRIES):
                      try:
                          with urllib.request.urlopen(req, timeout=90) as response:
                              raw = response.read()
                          return json.loads(raw) if raw else None
                      except urllib.error.HTTPError as exc:
                          detail = exc.read().decode(errors='replace')
                          raise RuntimeError(f'Jupyter HTTP {exc.code}: {detail[:300]}') from exc
                      except urllib.error.URLError:
                          if attempt == self.RETRIES - 1:
                              raise
                          time.sleep(2 ** attempt)

              def upload_file(self, local: Path, remote: str) -> None:
                  encoded = base64.b64encode(local.read_bytes()).decode()
                  endpoint = 'api/contents/' + urllib.parse.quote(remote, safe='/')
                  self.request('PUT', endpoint, {'type': 'file', 'format': 'base64', 'content': encoded})
                  print(f'Uploaded {local.name} -> {remote}')

              def download_file(self, remote: str, local: Path) -> None:
                  endpoint = 'api/contents/' + urllib.parse.quote(remote, safe='/') + '?content=1'
                  payload = self.request('GET', endpoint)
                  if not payload or payload.get('type') != 'file':
                      raise RuntimeError(f'Remote artifact not found: {remote}')
                  local.parent.mkdir(parents=True, exist_ok=True)
                  local.write_bytes(base64.b64decode(payload['content']))
                  print(f'Downloaded {remote} -> {local}')

              def execute(self, command: str, kernel_name: str = 'python3') -> int:
                  kernel = self.request('POST', 'api/kernels', {'name': kernel_name})
                  kid = kernel['id']
                  try:
                      return self._execute(kid, command)
                  finally:
                      try:
                          self.request('DELETE', f'api/kernels/{kid}')
                      except Exception:
                          pass

              def _execute(self, kid: str, command: str) -> int:
                  parsed = urlparse(self.base_url)
                  scheme = 'wss' if parsed.scheme == 'https' else 'ws'
                  session_id = uuid.uuid4().hex
                  ws_url = f'{scheme}://{parsed.netloc}{parsed.path}api/kernels/{kid}/channels?session_id={session_id}'
                  ws = websocket.create_connection(
                      ws_url,
                      header=[f'Authorization: token {self.token}'],
                      origin=f'{parsed.scheme}://{parsed.netloc}',
                      sslopt={'cert_reqs': ssl.CERT_REQUIRED},
                      timeout=180,
                  )
                  msg_id = uuid.uuid4().hex
                  code = (
                      'import subprocess\n'
                      f'_p = subprocess.Popen({command!r}, shell=True, text=True, '
                      'stdout=subprocess.PIPE, stderr=subprocess.STDOUT, bufsize=1)\n'
                      'for _line in _p.stdout:\n'
                      "    print(_line, end='', flush=True)\n"
                      '_p.wait()\n'
                      "print(f'\\n[remote exit code: {_p.returncode}]', flush=True)\n"
                  )
                  message = {
                      'header': {
                          'msg_id': msg_id,
                          'username': 'pasarpulse-runner',
                          'session': session_id,
                          'date': dt.datetime.now(dt.timezone.utc).isoformat(),
                          'msg_type': 'execute_request',
                          'version': '5.3',
                      },
                      'parent_header': {},
                      'metadata': {},
                      'content': {
                          'code': code,
                          'silent': False,
                          'store_history': False,
                          'user_expressions': {'exit_code': '_p.returncode'},
                          'allow_stdin': False,
                          'stop_on_error': True,
                      },
                      'channel': 'shell',
                      'buffers': [],
                  }
                  exit_code = None
                  idle = False
                  try:
                      ws.send(json.dumps(message))
                      while True:
                          reply = json.loads(ws.recv())
                          if reply.get('parent_header', {}).get('msg_id') != msg_id:
                              continue
                          kind = reply.get('msg_type') or reply.get('header', {}).get('msg_type')
                          content = reply.get('content', {})
                          if kind == 'stream':
                              print(content.get('text', ''), end='', flush=True)
                          elif kind == 'error':
                              print('\n'.join(content.get('traceback', [])), file=sys.stderr)
                          elif kind == 'execute_reply':
                              expr = content.get('user_expressions', {}).get('exit_code', {})
                              value = expr.get('data', {}).get('text/plain')
                              exit_code = int(value) if value is not None else 1
                          elif kind == 'status' and content.get('execution_state') == 'idle':
                              idle = True
                          if idle and exit_code is not None:
                              return exit_code
                  finally:
                      ws.close()

          client = JupyterClient(BASE_URL, token)
          client.upload_file(Path('.a100_secure/pasarpulse_optimizer.py'), f'{REMOTE_ROOT}/TEMP_pasarpulse_optimizer.py')
          client.upload_file(Path('.a100_secure/pasarpulse_lgb_fast.py'), f'{REMOTE_ROOT}/TEMP_pasarpulse_lgb_fast.py')

          command = f'''set -euo pipefail
          cd {REMOTE_ROOT}
          echo "=== A100 environment ==="
          hostname
          nvidia-smi --query-gpu=name,memory.total,memory.free --format=csv,noheader || true
          python - <<'CHECK'
          import sys
          print('python', sys.executable)
          for module in ['numpy','pandas','scipy','sklearn','lightgbm','pyarrow','holidays']:
              try:
                  m=__import__(module)
                  print(module, getattr(m,'__version__','ok'))
              except Exception as e:
                  print(module, 'MISSING', repr(e))
          CHECK
          python -m pip install --quiet --disable-pip-version-check lightgbm holidays pyarrow scipy scikit-learn
          mkdir -p proposed_model_run
          cp -f semi-finals/pasarpulse_data_bundle_2024-02_to_2026-07/data/processed/price_daily.csv proposed_model_run/price_daily.csv
          rm -rf proposed_model_run/results
          echo "=== Starting fast paper-aligned search ==="
          python TEMP_pasarpulse_lgb_fast.py --core TEMP_pasarpulse_optimizer.py --workdir proposed_model_run 2>&1 | tee proposed_model_run/a100_fast_run.log
          echo "=== Metrics ==="
          cat proposed_model_run/results/pooled_metrics.csv
          rm -f a100_pasarpulse_fast_results.zip
          zip -9 -j a100_pasarpulse_fast_results.zip \
            proposed_model_run/results/pooled_metrics.csv \
            proposed_model_run/results/fold_metrics.csv \
            proposed_model_run/results/oof_predictions.csv \
            proposed_model_run/results/feature_importance.csv \
            proposed_model_run/results/runtime_seconds.txt \
            proposed_model_run/a100_fast_run.log
          '''
          rc = client.execute(command)
          if rc != 0:
              raise SystemExit(rc)
          client.download_file(
              f'{REMOTE_ROOT}/a100_pasarpulse_fast_results.zip',
              Path('/tmp/a100_pasarpulse_fast_results.zip'),
          )
          PY
          python /tmp/a100_bridge.py

      - name: Upload A100 results
        if: steps.mode.outputs.encrypted == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: a100-pasarpulse-fast-results
          path: /tmp/a100_pasarpulse_fast_results.zip
          if-no-files-found: error
          retention-days: 30
