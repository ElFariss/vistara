name: Temporary A100 Progress Probe

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'TEMP_A100_SECURE_RUN.txt'
      - '.a100_secure/**'

permissions:
  contents: read

jobs:
  secure-a100:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore one-time RSA key
        id: keycache
        uses: actions/cache@v4
        with:
          path: /tmp/a100-rsa
          key: temporary-a100-rsa-pr-${{ github.event.pull_request.number }}

      - name: Decrypt and mask A100 credential
        shell: bash
        run: |
          test '${{ steps.keycache.outputs.cache-hit }}' = 'true'
          test -s /tmp/a100-rsa/private.pem
          base64 -d .a100_secure/token.enc.b64 > /tmp/a100-token.enc
          openssl pkeyutl -decrypt \
            -inkey /tmp/a100-rsa/private.pem \
            -in /tmp/a100-token.enc \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -out /tmp/a100-token
          chmod 600 /tmp/a100-token
          echo "::add-mask::$(cat /tmp/a100-token)"

      - name: Install bridge dependency
        run: python -m pip install --quiet websocket-client

      - name: Check live A100 optimizer progress
        run: python .a100_secure/a100_progress.py

      - name: Run prior-fold-only meta optimization
        run: python .a100_secure/a100_meta_probe.py

      - name: Upload completed GPU V2 bundle
        uses: actions/upload-artifact@v4
        with:
          name: a100-pasarpulse-gpu-v2-results
          path: /tmp/a100_pasarpulse_gpu_v2_results.zip
          if-no-files-found: ignore
          retention-days: 30
